[language-server.ty]
command = "uv"
args = ["run", "--project", ".", "ty", "server"]
required-root-patterns = ["uv.lock"]

[language-server.ruff]
command = "uv"
args = ["run", "--project", ".", "ruff", "server"]
required-root-patterns = ["uv.lock"]

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
auto-format = true

[language-server.just-lsp]
command = "just-lsp"

[[language]]
name = "just"
injection-regex = "just"
file-types = ["justfile", "Justfile", ".justfile"]
language-servers = [ "just-lsp" ]
indent = { tab-width = 2, unit = "  " }
